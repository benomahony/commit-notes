name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The release workflow runs this first, so nothing is released that fails it.
  workflow_call:

permissions:
  contents: read

# A newer push to the same branch or pull request makes an older run pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      # Installs the Zig in build.zig.zon's minimum_zig_version.
      - uses: xyzzylabs/setup-zig@7e5af686da64007a0797898801de180e5f4d3762 # v1.0.5
      - run: zig build test --summary all
      # A preview of this repository's own latest release, against real history.
      - name: commit-notes write --dry-run
        if: matrix.os == 'ubuntu-latest'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          zig build
          latest=$(git tag --list 'v[0-9]*' --sort=-v:refname | head -n1)
          if [ -n "$latest" ]; then ./zig-out/bin/commit-notes write "$latest" --dry-run; fi
